# Cloud Run 服务定义（§7.5）
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: control-plane
  labels:
    app: control-plane
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: gcr.io/PROJECT_ID/control-plane:latest
          name: control-plane
          resources:
            limits: { memory: "256Mi", cpu: "1" }
          ports: [{ containerPort: 8080 }]
          env:
            - { name: STORE_DRIVER, value: "firestore" }
            - { name: STORAGE_DRIVER, value: "gcs" }
            - { name: FIRESTORE_DATABASE, value: "(default)" }
          envFrom:
            - secretKeyRef:
                name: device-token-pepper
                key: latest
                secret: device-token-pepper
  traffic:
    - percent: 100
      latestRevision: true
