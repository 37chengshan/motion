<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>风格 10 - 信息图表 Infographic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1e293b; display: flex; flex-direction: column; align-items: center; padding: 40px; font-family: 'Inter', -apple-system, sans-serif; }
  .toggle { position: fixed; top: 20px; right: 20px; z-index: 100; background: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; }
  .label { color: #fff; margin-bottom: 16px; font-size: 18px; }
  .frames { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
  .portrait { width: 270px; height: 480px; background: #0f172a; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .portrait .content { padding: 24px 18px; height: 100%; display: flex; flex-direction: column; }
  .portrait .inf-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .portrait .inf-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .portrait .inf-label { font-size: 9px; color: #64748b; letter-spacing: 2px; text-transform: uppercase; }
  .portrait .inf-title { font-size: 22px; font-weight: 800; color: #f1f5f9; }
  .portrait .big-number { font-size: 48px; font-weight: 900; background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin: 10px 0; }
  .portrait .big-label { font-size: 10px; color: #64748b; text-align: center; }
  .portrait .bar-chart { margin-top: 16px; }
  .portrait .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .portrait .bar-label { font-size: 9px; color: #94a3b8; width: 60px; text-align: right; }
  .portrait .bar-track { flex: 1; height: 16px; background: #1e293b; border-radius: 4px; overflow: hidden; }
  .portrait .bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 8px; color: #fff; font-weight: 600; }
  .portrait .bar-fill.b1 { width: 90%; background: linear-gradient(90deg, #3b82f6, #60a5fa); }
  .portrait .bar-fill.b2 { width: 75%; background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
  .portrait .bar-fill.b3 { width: 60%; background: linear-gradient(90deg, #06b6d4, #22d3ee); }
  .portrait .bar-fill.b4 { width: 85%; background: linear-gradient(90deg, #10b981, #34d399); }
  .portrait .donut-section { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .portrait .donut { width: 70px; height: 70px; border-radius: 50%; background: conic-gradient(#3b82f6 0% 35%, #8b5cf6 35% 60%, #06b6d4 60% 80%, #10b981 80% 100%); display: flex; align-items: center; justify-content: center; }
  .portrait .donut-inner { width: 40px; height: 40px; border-radius: 50%; background: #0f172a; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #f1f5f9; font-weight: 700; }
  .portrait .legend { font-size: 8px; color: #94a3b8; }
  .portrait .legend-item { display: flex; align-items: center; gap: 4px; padding: 2px 0; }
  .portrait .legend-dot { width: 8px; height: 8px; border-radius: 2px; }
  .portrait .inf-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid #1e293b; display: flex; justify-content: space-between; font-size: 8px; color: #475569; }
  .landscape { width: 480px; height: 270px; background: #0f172a; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .landscape .content { padding: 18px 22px; height: 100%; display: flex; gap: 18px; }
  .landscape .col { flex: 1; display: flex; flex-direction: column; }
  .landscape .inf-header { display: flex; align-items: center; gap: 8px; }
  .landscape .inf-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .landscape .inf-label { font-size: 8px; color: #64748b; letter-spacing: 2px; text-transform: uppercase; }
  .landscape .inf-title { font-size: 18px; font-weight: 800; color: #f1f5f9; }
  .landscape .big-number { font-size: 36px; font-weight: 900; background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin: 6px 0; }
  .landscape .big-label { font-size: 8px; color: #64748b; text-align: center; }
  .landscape .bar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .landscape .bar-label { font-size: 8px; color: #94a3b8; width: 50px; text-align: right; }
  .landscape .bar-track { flex: 1; height: 12px; background: #1e293b; border-radius: 3px; overflow: hidden; }
  .landscape .bar-fill { height: 100%; border-radius: 3px; font-size: 7px; color: #fff; display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; }
  .landscape .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .landscape .kpi { background: #1e293b; border-radius: 8px; padding: 8px; text-align: center; }
  .landscape .kpi-num { font-size: 16px; font-weight: 800; color: #3b82f6; }
  .landscape .kpi-label { font-size: 7px; color: #64748b; margin-top: 2px; }
  @keyframes growBar { from { width: 0; } }
  .portrait .bar-fill.b1 { animation: growBar 0.8s ease both; }
  .portrait .bar-fill.b2 { animation: growBar 0.8s ease 0.1s both; }
  .portrait .bar-fill.b3 { animation: growBar 0.8s ease 0.2s both; }
  .portrait .bar-fill.b4 { animation: growBar 0.8s ease 0.3s both; }
</style>
</head>
<body>
<button class="toggle" onclick="document.querySelectorAll('.landscape').forEach(e=>e.style.display=e.style.display==='none'?'block':'none')">切换横屏/竖屏</button>
<div class="label">风格 10 — 信息图表 Infographic</div>
<div class="frames">
  <div class="portrait">
    <div class="content">
      <div class="inf-header">
        <div class="inf-icon">🔗</div>
        <div><div class="inf-label">开源项目数据</div><div class="inf-title">LangChain</div></div>
      </div>
      <div class="big-number">50K+</div>
      <div class="big-label">GitHub Stars</div>
      <div class="bar-chart">
        <div class="bar-row"><span class="bar-label">易用性</span><div class="bar-track"><div class="bar-fill b1">90</div></div></div>
        <div class="bar-row"><span class="bar-label">生态</span><div class="bar-track"><div class="bar-fill b2">75</div></div></div>
        <div class="bar-row"><span class="bar-label">文档</span><div class="bar-track"><div class="bar-fill b3">60</div></div></div>
        <div class="bar-row"><span class="bar-label">社区</span><div class="bar-track"><div class="bar-fill b4">85</div></div></div>
      </div>
      <div class="donut-section">
        <div class="donut"><div class="donut-inner">100%</div></div>
        <div class="legend">
          <div class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span> RAG 应用 35%</div>
          <div class="legend-item"><span class="legend-dot" style="background:#8b5cf6"></span> 聊天机器人 25%</div>
          <div class="legend-item"><span class="legend-dot" style="background:#06b6d4"></span> 数据分析 20%</div>
          <div class="legend-item"><span class="legend-dot" style="background:#10b981"></span> 其他 20%</div>
        </div>
      </div>
      <div class="inf-footer"><span>每日AI数据</span><span>#042</span></div>
    </div>
  </div>
  <div class="landscape">
    <div class="content">
      <div class="col">
        <div class="inf-header">
          <div class="inf-icon">🔗</div>
          <div><div class="inf-label">开源数据</div><div class="inf-title">LangChain</div></div>
        </div>
        <div class="big-number">50K+</div>
        <div class="big-label">GitHub Stars</div>
        <div class="kpi-grid">
          <div class="kpi"><div class="kpi-num">1.2K</div><div class="kpi-label">贡献者</div></div>
          <div class="kpi"><div class="kpi-num">50+</div><div class="kpi-label">LLM 集成</div></div>
          <div class="kpi"><div class="kpi-num">MIT</div><div class="kpi-label">协议</div></div>
          <div class="kpi"><div class="kpi-num">4.8</div><div class="kpi-label">评分 / 5</div></div>
        </div>
      </div>
      <div class="col" style="padding-top:8px">
        <div style="font-size:9px;color:#64748b;margin-bottom:8px">能力评估</div>
        <div class="bar-row"><span class="bar-label">易用性</span><div class="bar-track"><div class="bar-fill b1" style="width:90%">90</div></div></div>
        <div class="bar-row"><span class="bar-label">生态</span><div class="bar-track"><div class="bar-fill b2" style="width:75%">75</div></div></div>
        <div class="bar-row"><span class="bar-label">文档</span><div class="bar-track"><div class="bar-fill b3" style="width:60%">60</div></div></div>
        <div class="bar-row"><span class="bar-label">社区</span><div class="bar-track"><div class="bar-fill b4" style="width:85%">85</div></div></div>
        <div style="margin-top:auto;font-size:8px;color:#475569;border-top:1px solid #1e293b;padding-top:6px">每日AI数据 · #042</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
