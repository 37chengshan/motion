<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>风格 01 - 极简科技 Minimal Tech</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; padding: 40px; font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; }
  .toggle { position: fixed; top: 20px; right: 20px; z-index: 100; background: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .label { color: #fff; margin-bottom: 16px; font-size: 18px; letter-spacing: 2px; }
  .frames { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
  /* 竖屏 */
  .portrait { width: 270px; height: 480px; background: #ffffff; border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .portrait .content { padding: 40px 24px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .portrait .tag { font-size: 10px; color: #007AFF; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
  .portrait .title { font-size: 28px; font-weight: 700; color: #1d1d1f; line-height: 1.3; margin-top: 16px; }
  .portrait .subtitle { font-size: 13px; color: #86868b; line-height: 1.6; margin-top: 12px; }
  .portrait .feature-list { list-style: none; margin-top: 20px; }
  .portrait .feature-list li { font-size: 12px; color: #1d1d1f; padding: 8px 0; border-bottom: 1px solid #f5f5f7; display: flex; align-items: center; gap: 8px; }
  .portrait .feature-list li::before { content: ''; width: 6px; height: 6px; background: #007AFF; border-radius: 50%; }
  .portrait .bottom-bar { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 16px; }
  .portrait .logo { font-size: 14px; font-weight: 600; color: #1d1d1f; }
  .portrait .page { font-size: 11px; color: #86868b; }
  /* 横屏 */
  .landscape { width: 480px; height: 270px; background: #ffffff; border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .landscape .content { display: flex; height: 100%; }
  .landscape .left { flex: 1; padding: 32px; display: flex; flex-direction: column; justify-content: center; }
  .landscape .right { width: 180px; background: #f5f5f7; display: flex; align-items: center; justify-content: center; }
  .landscape .right .mock { width: 120px; height: 200px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; }
  .landscape .tag { font-size: 9px; color: #007AFF; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
  .landscape .title { font-size: 22px; font-weight: 700; color: #1d1d1f; line-height: 1.3; margin-top: 10px; }
  .landscape .subtitle { font-size: 11px; color: #86868b; line-height: 1.5; margin-top: 8px; }
  .landscape .features { display: flex; gap: 12px; margin-top: 16px; }
  .landscape .features .feat { background: #f5f5f7; padding: 6px 12px; border-radius: 8px; font-size: 10px; color: #1d1d1f; }
  .landscape .bottom-bar { position: absolute; bottom: 12px; left: 32px; right: 32px; display: flex; justify-content: space-between; font-size: 10px; color: #86868b; }
  /* 动画演示 */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .portrait .tag { animation: fadeUp 0.6s ease both; }
  .portrait .title { animation: fadeUp 0.6s ease 0.1s both; }
  .portrait .subtitle { animation: fadeUp 0.6s ease 0.2s both; }
  .portrait .feature-list li { animation: fadeUp 0.4s ease both; }
  .portrait .feature-list li:nth-child(1) { animation-delay: 0.3s; }
  .portrait .feature-list li:nth-child(2) { animation-delay: 0.4s; }
  .portrait .feature-list li:nth-child(3) { animation-delay: 0.5s; }
</style>
</head>
<body>
<button class="toggle" onclick="document.querySelectorAll('.landscape').forEach(e=>e.style.display=e.style.display==='none'?'block':'none')">切换横屏/竖屏</button>
<div class="label">风格 01 — 极简科技 Minimal Tech</div>
<div class="frames">
  <div class="portrait">
    <div class="content">
      <div>
        <div class="tag">开源项目推荐</div>
        <div class="title">LangChain</div>
        <div class="subtitle">大语言模型应用开发框架，让 AI 应用开发变得简单高效</div>
        <ul class="feature-list">
          <li>链式调用，模块化设计</li>
          <li>支持 50+ LLM 提供商</li>
          <li>内置向量数据库集成</li>
        </ul>
      </div>
      <div class="bottom-bar">
        <span class="logo">每日AI</span>
        <span class="page">01 / 05</span>
      </div>
    </div>
  </div>
  <div class="landscape">
    <div class="content">
      <div class="left">
        <div class="tag">开源项目推荐</div>
        <div class="title">LangChain</div>
        <div class="subtitle">大语言模型应用开发框架</div>
        <div class="features">
          <span class="feat">链式调用</span>
          <span class="feat">50+ LLM</span>
          <span class="feat">向量数据库</span>
        </div>
        <div class="bottom-bar"><span>每日AI</span><span>01 / 05</span></div>
      </div>
      <div class="right"><div class="mock"></div></div>
    </div>
  </div>
</div>
</body>
</html>
